spring.application.name=library-api
server.address=${API_HOST:127.0.0.1}
server.port=${API_PORT:3001}
server.shutdown=graceful
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/library_dev}
spring.datasource.username=${DATABASE_USER:library_app}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
library.origin=${APP_ORIGIN:http://localhost:5173}
library.cookie-secure=${COOKIE_SECURE:false}
library.session-hours=8
library.initialize-admin=${INITIALIZE_ADMIN:false}
library.seed-demo=${SEED_DEMO:false}
spring.main.banner-mode=off
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.supported-submit-methods=get
